<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>For You 🌹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow & stars -->
  <div class="ambient-glow"></div>
  <div class="stars-layer" id="starsLayer"></div>

  <!-- Audio control (discreet, top-right) -->
  <button id="audioBtn" class="audio-control" title="Musiqa">
    <span id="audioIcon">🎵</span>
  </button>

  <!-- Central Experience Container -->
  <div class="stage-container" id="stage">
    <!-- Canvas for the Glowing Envelope & Blooming Rose -->
    <canvas id="stageCanvas"></canvas>

    <!-- Gentle interaction hint (disappears once clicked) -->
    <div class="click-prompt" id="clickPrompt">
      <span class="prompt-heart">♥</span>
      <span class="prompt-text">Ochish uchun bosing</span>
    </div>
  </div>

  <!-- Background Music (User's new song) -->
  <audio id="bgAudio" src="song.mp3" preload="auto" loop></audio>

  <!-- Scripts -->
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
